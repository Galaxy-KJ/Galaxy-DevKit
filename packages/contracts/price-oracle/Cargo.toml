[package]
name = "price-oracle"
version = "1.1.0"
edition = "2021"
description = "On-chain price oracle Soroban contract for Galaxy DevKit"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
